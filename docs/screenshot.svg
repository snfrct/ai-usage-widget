<svg width="380" height="318" viewBox="0 0 380 318" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>AI Usage Widget — illustrative sample data</title>

