  <rect x="24" y="59" width="163" height="8" rx="4" fill="#e7e5e1"/>
  <rect x="24" y="59" width="62" height="8" rx="4" fill="#3b82f6"/>
  <rect x="193" y="59" width="163" height="8" rx="4" fill="#e7e5e1"/>
  <rect x="193" y="59" width="116" height="8" rx="4" fill="#f59e0b"/>

